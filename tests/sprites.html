<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Check</title>
<style>body{margin:0;background:#f6efe6;font:12px system-ui,sans-serif;color:#5a3020}h2{margin:10px;font-size:14px}canvas{display:block;margin:0 10px}</style></head>
<body><h2>Character sprite check — every animation × direction (frames left→right), foot pivot = red dot</h2><div id="out"></div>
<script src="../js/manifest.js"></script><script src="../js/assets.js"></script>
<script>
for (const k in CST.MANIFEST.atlases) { const a = CST.MANIFEST.atlases[k]; if (!/^(data:|\.\.\/)/.test(a.file)) a.file = "../" + a.file; }
CST.Assets.load().then(() => {
  const M = CST.MANIFEST, out = document.getElementById('out'), D = ['front','front_right','right','back_right','back','back_left','left','front_left','all'];
  for (const ch in M.chars) {
    const rows = []; for (const an in M.chars[ch].anims) for (const d of D) if (M.chars[ch].anims[an][d]) rows.push([an, d, M.chars[ch].anims[an][d]]);
    const maxF = Math.max(...rows.map(r => r[2].length)); const cell = 76, W = 150 + maxF * cell, H = 24 + rows.length * cell;
    const h = document.createElement('h2'); h.textContent = ch; out.appendChild(h);
    const c = document.createElement('canvas'); c.width = W; c.height = H; c.style.width = W / 1.3 + 'px'; out.appendChild(c); const x = c.getContext('2d');
    rows.forEach(([an, d, fr], i) => {
      const y = 24 + i * cell; x.fillStyle = i % 2 ? '#efe2d2' : '#f8efe4'; x.fillRect(0, y, W, cell); x.fillStyle = '#5a3020'; x.fillText(an + ' · ' + d, 6, y + cell / 2);
      fr.forEach((f, j) => { const a = M.atlases[M.chars[ch].atlas].frames[f[0]], im = CST.Assets.img[M.chars[ch].atlas]; const s = Math.min(1, (cell - 6) / a[3]) * 0.55;
        const px = 150 + j * cell + cell / 2, py = y + cell - 4; x.drawImage(im, a[0], a[1], a[2], a[3], px - f[1] * s, py - f[2] * s, a[2] * s, a[3] * s); x.fillStyle = 'red'; x.fillRect(px - 1.5, py - 1.5, 3, 3); });
    });
  }
});
</script></body></html>
